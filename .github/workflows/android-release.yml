name: Android Release

# Builds a signed app bundle and uploads it to the Google Play internal testing track.
# Runs only on manual dispatch or when a version tag is pushed, never on pull requests,
# so secrets are not exposed to forks.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.omnidesk.omnideskMobile

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      # The first bundle was uploaded manually with versionCode 100, and run_number restarts at 1
      # for this workflow, so an offset keeps every CI build above the last uploaded code.
      - name: Build app bundle
        run: flutter build appbundle --release --build-number=$((100 + ${{ github.run_number }}))

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnidesk-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Clean up signing material
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
